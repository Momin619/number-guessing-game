<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
</head>
<body>
    <div class="container">
        <h1 class="header">Welcome to the Number Guessing Game</h1>
        <p class="instructions">Guess a number between 0 and 99. Let's see if you can get it right!</p>
    </div>
    <div class="game-area">
    <div class="number">
        <label for="number">Enter your guess:</label>
        <input type="number" id="number" placeholder="Enter a number" />
    </div>
    <button id="submit" class="submit-button">Submit Guess</button>
    <p id="feedback" class="feedback"></p>
    <button id="reset" class="reset-button" style="display: none;">Play Again</button>
</div>

    <script src="./app.js"></script>
</body>
</html>
